# All-in-one demo: app + Postgres + s3mock + Caddy.
# Postgres and s3mock are not published to the host.
services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-off}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://vbs:${POSTGRES_PASSWORD}@postgres:5432/vbs
      S3_ENDPOINT: http://s3:9090
      S3_REGION: us-east-1
      S3_ACCESS_KEY: vbs
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: vbs
      S3_PUBLIC_URL: /files
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/me').then(r=>process.exit(r.status===200||r.status===401?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vbs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vbs
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vbs -d vbs"]
      interval: 2s
      timeout: 5s
      retries: 30

  s3:
    image: adobe/s3mock:latest
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: vbs
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      JAVA_TOOL_OPTIONS: -Xmx256m -XX:MaxMetaspaceSize=64m
    volumes:
      - s3data:/s3mockroot
    expose:
      - "9090"

volumes:
  pgdata:
  s3data:
  caddy_data:
  caddy_config:
